version: 1
subjects:
  tanakh:
    id: tanakh
    title_he: תנ"ך
    title_en: Tanakh (Hebrew Bible)
    tracks:
    - mmd
    - mamlachti
    units:
    - 2
    - 3
    - 5
    core_commentators:
    - rashi
    - ramban
    - ibn_ezra
    - rashbam
    - sforno
    - radak
    - malbim
    - metzudat_david
    - metzudat_tzion
    track_details:
      mmd:
        title_he: תנ"ך חמ"ד (ממלכתי-דתי)
        title_en: Tanakh — State-Religious Track (MMD)
        exam_codes:
        - '2551'
        - '2575'
        - '2585'
        units_supported:
        - 3
        - 5
        focus_he: 'לימוד תנ"ך בעיון ובבקיאות לאור פרשנות הראשונים והאחרונים: זיהוי הקושי בפסוק (לשוני, תחבירי, ענייני או תיאולוגי),
          הבחנה בין פשט לדרש, השוואת שיטות מפרשים (רש"י, רמב"ן, אבן עזרא, רשב"ם, ספורנו, רד"ק, מלבי"ם, מצודות), וניתוח קטע
          שלא נלמד (Unseen).

          '
        focus_en: 'In-depth (Iyun) and broad-knowledge (Bekiut) Bible study through classical commentators: identifying textual
          difficulties, distinguishing pshat from drash, comparing commentators (Rashi, Ramban, Ibn Ezra, Rashbam, Sforno,
          Radak, Malbim, Metzudot), and analyzing an unseen passage.

          '
        syllabus_clusters_he:
        - תורה בעיון (בראשית, שמות, ויקרא, במדבר, דברים — עם רש"י, רמב"ן, אבן עזרא, רשב"ם וספורנו)
        - נביאים ראשונים (יהושע, שופטים, שמואל א–ב, מלכים א–ב — בקיאות ועיון)
        - נביאים אחרונים (ישעיהו, ירמיהו, יחזקאל, תרי עשר — נבואה, מוסר והיסטוריה)
        - כתובים (תהילים, משלי, איוב, מגילות, עזרא ונחמיה)
        - קטע שלא נלמד (Unseen) — יישום מיומנויות קריאה ופרשנות
      mamlachti:
        title_he: תנ"ך ממלכתי (כללי)
        title_en: Tanakh — General State Track (Mamlachti)
        exam_codes:
        - '1281'
        - 0581
        units_supported:
        - 2
        - 5
        focus_he: 'קריאה צמודה של הטקסט המקראי, אמצעים אומנותיים ורטוריים (מילה מנחה, תקבולת, כינוי, אירוניה, אנלוגיה, מבנה
          כיאסטי), השוואה פנים-מקראית, חוק וחברה במקרא, ומנהיגות ונבואה.

          '
        focus_en: 'Close reading of the biblical text, literary and rhetorical devices (leitwort, parallelism, chiasmus, analogy,
          irony), intra-biblical comparison, biblical law and society, leadership and prophecy.

          '
        syllabus_clusters_he:
        - סיפורי האבות וראשית האומה (בראשית–שמות)
        - דמות המנהיג והמלוכה בישראל (שמואל ומלכים)
        - חוק, צדק וחברה במקרא (דברים, ויקרא, שמות ונביאים אחרונים)
        - חורבן, גלות ושיבת ציון (ירמיהו, יחזקאל, ישעיהו מ–סו, עזרא ונחמיה)
        - ספרות החכמה והשירה המקראית (תהילים, איוב, קהלת, משלי)
        - קטע שלא נלמד (Unseen) — קריאה צמודה של פרק מקראי חדש
  gemara:
    id: gemara
    title_he: גמרא (תלמוד בבלי)
    title_en: Gemara (Babylonian Talmud)
    tracks:
    - mmd
    - mamlachti
    units:
    - 2
    - 3
    - 5
    core_commentators:
    - rashi
    - tosafot
    - rambam
    - shulchan_aruch
    - bartenura
    - mishnah_berurah
    track_details:
      mmd:
        title_he: גמרא חמ"ד — לקט מצוות, סוגיות ועיון
        title_en: Gemara MMD — Talmudic Sugyot & In-Depth Iyun
        exam_codes:
        - '5391'
        - '5291'
        - '6281'
        units_supported:
        - 3
        - 5
        focus_he: 'ניתוח מבנה הסוגיה (שקלא וטריא), זיהוי מונחי יסוד בארמית ותפקידם הלוגי, הבחנה בין דברי תנאים לדברי אמוראים,
          הבהרת הסברות שבבסיס המחלוקות, ובעיון (5 יח"ל) — לימוד מעמיק של רש"י ותוספות על הדף (קושיא, תירוץ, אוקימתא ונפקא
          מינה).

          '
        focus_en: 'Analyzing the structure of the Talmudic sugya (shakla vetarya), identifying Aramaic structural terms and
          their logical roles, distinguishing Tannaitic from Amoraic statements, articulating underlying rationales (svara),
          and for 5-unit Iyun — studying Rashi and Tosafot (kushya, terutz, nafka mina).

          '
        syllabus_clusters_he:
        - מסכתות סדר נזיקין (בבא קמא, בבא מציעא, בבא בתרא, סנהדרין)
        - מסכתות סדר מועד וברכות (ברכות, שבת, פסחים, ביצה, סוכה)
        - מסכתות סדר נשים (קידושין, גיטין, כתובות)
        - עיון בראשונים על הדף — רש"י ותוספות (שאלון 6281)
      mamlachti:
        title_he: תורה שבעל פה ותרבות ישראל — סוגיות תלמודיות
        title_en: Oral Law & Talmudic Culture (General Track)
        exam_codes:
        - '5291'
        units_supported:
        - 2
        - 5
        focus_he: 'קריאה מונחית במקורות חז"ל (משנה, אגדה וסוגיות תלמודיות נבחרות), הבנת הדילמה הערכית והמשפטית, וביאור מונחי
          יסוד בשפת התלמוד.

          '
        focus_en: 'Guided reading in rabbinic texts (Mishnah, Aggadah, and selected Talmudic sugyot), understanding ethical
          and legal dilemmas, and explaining core Talmudic terms.

          '
  toshba:
    id: toshba
    title_he: תושב"ע (משנה והלכה)
    title_en: Toshba (Mishnah & Halacha)
    tracks:
    - mmd
    - mamlachti
    units:
    - 2
    - 3
    - 5
    core_commentators:
    - bartenura
    - rambam
    - shulchan_aruch
    - mishnah_berurah
    - rashi
    track_details:
      mmd:
        title_he: תושב"ע חמ"ד — משנה, הלכה ואירועונים לימודיים
        title_en: Toshba MMD — Mishnah, Halachic Progression & Exam Case Studies
        exam_codes:
        - '5391'
        - '5381'
        units_supported:
        - 3
        - 5
        focus_he: 'פירוק מבני של המשנה (כותרת/נושא, מקרה, דין, טעם ומחלוקת), פירוש ר"ע מברטנורא והרמב"ם, השתלשלות ההלכה מן
          המשנה והגמרא אל השולחן ערוך והמשנה ברורה, וניתוח "אירועון הלכתי" לימודי לבחינה (בכפוף לעקרון VIII: לימוד עיוני לבגרות
          בלבד, אינו פסק הלכה למעשה).

          '
        focus_en: 'Structural breakdown of the Mishnah (case, ruling, rationale, dispute), Bartenura and Rambam commentaries,
          halachic progression to Shulchan Arukh and Mishnah Berurah, and educational halachic case studies for exam preparation
          (subject to Principle VIII: academic study only, never a practical psak).

          '
        syllabus_clusters_he:
        - אישות ומשפחה
        - שבת ומועדים
        - כשרות ומאכלות אסורות
        - נזיקין, השבת אבידה ודיני ממונות
        - צדקה, משפט וחברה
        - מצוות התלויות בארץ
      mamlachti:
        title_he: משנה ויצירה תלמודית — מסלול ממלכתי
        title_en: Mishnah & Rabbinic Literature — General Track
        exam_codes:
        - '5291'
        units_supported:
        - 2
        - 5
        focus_he: 'הכרת עולם המשנה וההלכה, הבנת מבנה המשנה (מקרה, דין וטעם), וניתוח דילמות מוסריות וחברתיות בדברי חז"ל.

          '
        focus_en: 'Introduction to the world of the Mishnah and Halacha, understanding Mishnah structure (case, ruling, reason),
          and analyzing moral and social dilemmas in rabbinic literature.

          '
  machshava:
    id: machshava
    title_he: מחשבת ישראל (הגות ואמונה)
    title_en: Jewish Thought (Machshevet Yisrael)
    tracks:
    - mmd
    - mamlachti
    units:
    - 2
    - 3
    - 5
    core_commentators:
    - rambam
    - yehuda_halevi
    - kook
    - soloveitchik
    - maharal
    - saadia_gaon
    - crescas
    - albo
    track_details:
      mmd:
        title_he: מחשבת ישראל חמ"ד — אמונה, עבודת ה' וחברה
        title_en: Jewish Thought MMD — Faith, Philosophy & Society
        exam_codes:
        - '281'
        - '282'
        - '5281'
        units_supported:
        - 2
        - 5
        focus_he: 'לימוד מעמיק של הגות יהודית, בירור מושגי אמונה והשגחה, יחסי דת ומדע, גאולה ולאומיות, תפילה ומוסר, מתוך ספרי
          היסוד: הכוזרי לרבי יהודה הלוי, רמב"ם (הקדמות, הלכות תשובה ודעות, שמונה פרקים), הרב קוק (אורות התשובה, מאמרי הראי"ה),
          והרב י"ד סולובייצ''יק (איש האמונה, קול דודי דופק).'
        focus_en: In-depth study of Jewish philosophy, faith, providence, religion and science, national revival, prayer and
          ethics through classical and modern foundational texts (Kuzari, Rambam, Rav Kook, Rav Soloveitchik).
        syllabus_clusters_he:
        - מעגל החיים, תפילה ועבודת ה' שבלב
        - אמונה, גאולה ומדינת ישראל (הרב קוק והרב סולובייצ'יק)
        - ספר הכוזרי לרבי יהודה הלוי (מאמר ראשון, היסטוריה והתגלות)
        - תורת האדם והמוסר (רמב"ם — שמונה פרקים והלכות דעות)
      mamlachti:
        title_he: מחשבת ישראל — מסלול כללי
        title_en: Jewish Thought — General Track
        exam_codes:
        - '281'
        units_supported:
        - 2
        - 5
        focus_he: הגות יהודית מודרנית וקלאסית, שאלות זהות, מוסר ואתיקה אוניברסלית.
        focus_en: Modern and classical Jewish thought, identity, ethics and universal morality.
