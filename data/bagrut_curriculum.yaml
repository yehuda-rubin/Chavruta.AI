# Pedagogical Aramaic-Hebrew-English glossary for Talmudic Sugya & Bagrut Gemara questions.
aramaic_scaffold:
  - term: "מנא הני מילי (מנלן)"
    role_he: "שאלת מקור"
    meaning_he: "מניין לנו הדברים האלה? בקשת מקור מן התורה שבכתב לדין שנאמר במשנה או במימרא."
    meaning_en: "From where are these words derived? Seeking a biblical source for a Mishnaic or Amoraic ruling."
  - term: "מאי שנא"
    role_he: "שאלת הבחנה / קושיא"
    meaning_he: "מה שונה? מדוע קיים הבדל בדין בין שני מקרים שנראים דומים (למשל בין הרישא לסיפא)?"
    meaning_en: "What is the difference? Why does the ruling differ between two seemingly similar cases (e.g., first and second clauses)?"
  - term: "איבעיא להו"
    role_he: "בעיה / ספק הלכתי"
    meaning_he: "נשאלה להם (לבני הישיבה): הצגת שאלה או ספק הלכתי שטרם הוכרע."
    meaning_en: "It was asked by them: Introducing an unresolved legal inquiry or dilemma in the study hall."
  - term: "תא שמע (ת\"ש)"
    role_he: "הבאת ראיה / פשיטת ספק"
    meaning_he: "בוא ושמע: הבאת מקור (משנה, ברייתא או מימרא) כדי להוכיח צד מסוים או לפשוט ספק."
    meaning_en: "Come and hear: Introducing a proof-text (Mishnah, Baraita, or statement) to resolve an inquiry or support a position."
  - term: "מיתיבי"
    role_he: "קושיא ממקור תנאי"
    meaning_he: "משיבים (מקשים) על דברי אמורא ממקור בעל סמכות גבוהה יותר (משנה או ברייתא)."
    meaning_en: "They objected: Challenging an Amoraic statement from a higher-authority Tannaitic source (Mishnah or Baraita)."
  - term: "ורמינהו"
    role_he: "סתירה בין שני מקורות שווי-מעמד"
    meaning_he: "והשלך אותם זה בזה: הצגת סתירה בין שני מקורות תנאיים (משנה מול משנה, או ברייתא מול ברייתא)."
    meaning_en: "Contrast them: Pointing out a contradiction between two sources of equal Tannaitic authority."
  - term: "הכא במאי עסקינן (אוקימתא)"
    role_he: "תירוץ על ידי העמדת המקרה"
    meaning_he: "כאן במה אנו עוסקים? יישוב קושיא או סתירה על ידי צמצום המקור למקרה או לתנאים מסוימים."
    meaning_en: "With what case are we dealing here? (Okimta): Resolving a contradiction by limiting a source to specific circumstances."
  - term: "תיובתא"
    role_he: "דחייה מוחלטת"
    meaning_he: "קושיא מכרעת שאין לה תירוץ, הדוחה את שיטת האמורא שלהלכה."
    meaning_en: "Definitive refutation: A decisive objection from an authoritative source that refutes an Amora's position."
  - term: "בשלמא ... אלא"
    role_he: "קושיא ממוקדת על אחת השיטות"
    meaning_he: "ניחא לשיטת פלוני (דבריו מסתברים), אבל לשיטת אלמוני — קשה!"
    meaning_en: "Granted according to X it makes sense, but according to Y it is difficult!"
  - term: "אלא"
    role_he: "חזרה מן ההבנה הקודמת והצעת מהלך חדש"
    meaning_he: "דחיית ההסבר או האוקימתא הקודמת ומעבר לפירוש או תירוץ חדש."
    meaning_en: "Rather: Abandoning the previous explanation and proposing a new interpretation or resolution."
  - term: "לעולם"
    role_he: "חזרה להבנה הראשונית"
    meaning_he: "באמת (כפי שאמרנו בתחילה): קיום ההסבר הראשון למרות הקושיא, תוך הוספת תיקון או הבחנה."
    meaning_en: "Actually / Still: Maintaining the initial proposition despite the objection, with a refined distinction."
  - term: "קא משמע לן (קמ\"ל)"
    role_he: "הצגת החידוש"
    meaning_he: "משמיע לנו: הסבר מדוע המקור אינו מיותר — איזה חידוש הלכתי הוא בא ללמד (ולשלול 'הוה אמינא')."
    meaning_en: "It teaches us: Explaining the novel point of the source and what mistaken assumption (hava amina) it rules out."
  - term: "נפקא מינה (נפ\"מ)"
    role_he: "הבדל מעשי בין שיטות"
    meaning_he: "יוצא מזה: מהו המקרה המעשי שבו יתבטא ההבדל בין שני פירושים או שתי שיטות?"
    meaning_en: "Practical difference: What concrete case results in a different ruling depending on the two views?"
  - term: "מאי בינייהו"
    role_he: "בירור נקודת המחלוקת"
    meaning_he: "מה ביניהם? במה נחלקו למעשה שני החכמים שלכאורה אומרים דין דומה?"
    meaning_en: "What is between them? Clarifying the practical or conceptual difference between two seemingly similar views."
  - term: "שמע מינה (ש\"מ)"
    role_he: "הסקת מסקנה"
    meaning_he: "למד מכאן: הסקת מסקנה ברורה מתוך המקור שהובא."
    meaning_en: "Learn from this: Drawing a clear conclusion from the cited source."
  - term: "הלכתא"
    role_he: "הכרעת ההלכה בסוגיה"
    meaning_he: "הלכה כדברי פלוני: הכרעת הגמרא בסוף הדיון."
    meaning_en: "The law is: The Talmud's final halachic conclusion on the dispute."

rubric_principles_he:
  core_formula: "טענה מפורשת + ביסוס/ציטוט מדויק מן המקור [S#] + הסבר במילים שלך המקשר בין הציטוט לטענה."
  principles:
    - id: claim_cite_explain
      title: "מבנה תשובה מלאה (טענה – ביסוס – הסבר)"
      rule: >
        תשובה מלאה בבחינת הבגרות חייבת לכלול שלושה רכיבים: (1) מענה ישיר לשאלה (הטענה/הדין/הקושי);
        (2) ביסוס מן הכתוב או מן המפרש באמצעות ציטוט ממוקד או הפניה מפורשת [S#];
        (3) הסבר במילים של התלמיד המראה כיצד הציטוט מוכיח את הטענה. ציטוט ללא הסבר (או הסבר ללא עיגון בטקסט
        כאשר נדרש ביסוס) יזכה בניקוד חלקי בלבד (לרוב 50%–60% ממשקל הסעיף).
    - id: commentary_difficulty
      title: "זיהוי הקושי בפרשנות (תנ\"ך וגמרא)"
      rule: >
        כאשר נשאלים "מה הקושי בפסוק/בגמרא שבעקבותיו פירש המפרש?", אין להסתפק בהעתקת דברי המפרש.
        יש להצביע במפורש על החריגה, הכפילות, הסתירה או החסר בלשון המקור עצמו, ורק לאחר מכן להראות כיצד
        המפרש מיישב זאת.
    - id: sugya_structure
      title: "הבחנה בין תוכן לתפקיד בסוגיה (גמרא)"
      rule: >
        בשאלות על שלבי השקלא וטריא (קושיא, תירוץ, אוקימתא, ראיה), על התלמיד לציין הן את התפקיד המבני של השלב
        והן את תוכנו ההלכתי-ענייני בסוגיה הספציפית, תוך ביאור המונח הארמי בהקשרו.
    - id: mishnah_halacha_components
      title: "פירוק משנה והלכה (מקרה – דין – טעם)"
      rule: >
        בשאלות תושב"ע ומשנה יש להבחין בבירור בין: (א) המקרה (הסיטואציה העובדתית); (ב) הדין (פסק ההלכה:
        חייב/פטור, מותר/אסור, כשר/פסול); (ג) הטעם (הנימוק או הסברא לדין). ערבוב בין המקרה לדין גורע נקודות.
    - id: halachic_humility_principle_viii
      title: "ענווה הלכתית בלימוד אירועונים (Principle VIII)"
      rule: >
        שאלות יישום ו"אירועון הלכתי" במצב בגרויות נועדו לבחון הבנה לימודית-עיונית של המקורות לקראת בחינת הבגרות בלבד.
        המחוון והמשוב מציגים את השיטות והנימוקים מתוך המקורות שאוחזרו, ומציינים במפורש כי אין לראות בכך פסק הלכה למעשה.

rubric_principles_en:
  core_formula: "Explicit Claim + Accurate Textual Citation [S#] + Own-Words Explanation linking the citation to the claim."
  principles:
    - id: claim_cite_explain
      title: "Complete Answer Structure (Claim – Citation – Explanation)"
      rule: >
        A full-credit Bagrut response requires three components: (1) a direct answer to the prompt (claim/ruling/difficulty);
        (2) textual grounding via a focused quote or explicit reference [S#]; and
        (3) an explanation in the student's own words demonstrating how the quote proves the claim.
        Quoting without explaining (or explaining without textual grounding when required) earns partial credit only (typically 50%–60%).
    - id: commentary_difficulty
      title: "Identifying the Textual Difficulty (Tanakh & Gemara)"
      rule: >
        When asked "What textual difficulty prompted the commentator's explanation?", simply restating the commentary is insufficient.
        The student must pinpoint the anomaly, redundancy, contradiction, or gap in the base verse/sugya itself, and then show how
        the commentator resolves it.
    - id: sugya_structure
      title: "Distinguishing Structural Role from Content (Gemara)"
      rule: >
        In questions on the steps of the shakla vetarya (objection, resolution, okimta, proof), the student must state both
        the structural/logical function of the step and its specific legal content in the sugya, translating key Aramaic terms in context.
    - id: mishnah_halacha_components
      title: "Mishnah & Halacha Breakdown (Case – Ruling – Rationale)"
      rule: >
        In Toshba/Mishnah questions, clearly separate: (a) the Case (factual scenario); (b) the Ruling (liable/exempt, permitted/prohibited);
        and (c) the Rationale (underlying reason or svara). Conflating the case with the ruling deducts points.
    - id: halachic_humility_principle_viii
      title: "Halachic Humility in Case Studies (Principle VIII)"
      rule: >
        Halachic case-study questions (Eru'on Halachti) in Bagrut Mode strictly assess academic comprehension of the retrieved sources
        for exam preparation. Rubrics and feedback present the retrieved positions and rationales for study purposes only, never as a practical halachic ruling (psak).
