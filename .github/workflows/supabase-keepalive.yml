name: Supabase keep-alive

# Free Supabase projects pause after 7 days with no activity, and "activity" specifically means a
# real database query — an auth/health ping does not count (verified against Supabase's own
# documented pause behavior, not assumed). This hits a tiny public table once a day, well inside
# that window, so the project (and the sign-in feature it backs) never gets paused in the first
# place.
#
# One-time setup before this does anything:
#   1. In the Supabase SQL editor, run:
#        create table if not exists public.keep_alive (
#          id bigint generated by default as identity primary key,
#          pinged_at timestamptz not null default now()
#        );
#        alter table public.keep_alive enable row level security;
#        create policy "anon can read keep_alive" on public.keep_alive
#          for select to anon using (true);
#        insert into public.keep_alive default values;
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret:
#        SUPABASE_URL          e.g. https://your-project-ref.supabase.co
#        SUPABASE_ANON_KEY     the project's anon public key (safe to use here — it's the same key
#                               already shipped to every browser; RLS above is what limits it to a
#                               read-only ping, not a secret needing extra protection)

on:
  schedule:
    - cron: "0 4 * * *"     # once a day is plenty against a 7-day pause window
  workflow_dispatch:         # manual "run now" button in the Actions tab, for testing this workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the keep-alive table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL/SUPABASE_ANON_KEY not set yet — add them as repo secrets (see this file's header)"
            exit 0
          fi
          # A random query param defeats any accidental caching layer between here and Postgres —
          # a cached response wouldn't actually touch the database and wouldn't reset the timer.
          curl -fsS --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id&limit=1&_=$(date +%s)" \
            > /dev/null && echo "pinged Supabase — OK" \
            || echo "::warning::Supabase keep-alive ping failed (project may already be paused, or the keep_alive table/policy isn't set up yet)"
