# Chavruta.AI — the public edge. Terminates the client connection, then splits traffic two ways:
# the API routes to the FastAPI backend, and everything else to the Next.js app (service `ui`).
#
# This container is the only thing published to the host. It exists rather than exposing Next
# directly because it is what appends the real client address: the API's per-IP rate limiter reads
# the last X-Forwarded-For hop (CHAVRUTA_TRUSTED_PROXY_HOPS=1), so without this every request in the
# system would arrive wearing one IP and the limiter would be meaningless.

server {
    listen 80;
    server_name _;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Match the backend's body cap (CHAVRUTA_MAX_BODY_BYTES, default 2MB) with headroom — nginx's
    # own default is 1MB, which would 413 a large attached PDF/Word source BEFORE it reaches the app.
    client_max_body_size 3m;

    # ── API ──────────────────────────────────────────────────────────────────
    # The browser calls these as same-origin bare paths (/query, /jobs/…, /me) — see web/lib/api.ts.
    # ⚠️ This list and the `rewrites()` in web/next.config.mjs describe the SAME API surface and must
    # be kept in step. A path missing from one of them does not fail loudly: it falls through to the
    # app and returns an HTML page, which the client then tries to parse as JSON. That is exactly how
    # /jobs broke every async generation once already.
    location ~ ^/(query|sessions|jobs|lessons|me|account|billing|coupons|health|ready)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generation runs on the async job queue (POST returns 202, the client polls GET /jobs/{id}),
        # so no request should be long-lived. The generous read timeout is a safety net for the
        # synchronous /query and /sessions routes, which still block until the answer is ready.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # /admin is special: unlike the paths above, the bare path is ALSO a real Next.js page
    # (web/app/admin/page.tsx) — every backend admin route requires a segment after it
    # (/admin/overview, /admin/usage-by-owner, …), so only /admin/<something> goes to the API;
    # bare /admin (and /admin/) falls through to the app below, which renders the actual page.
    location ~ ^/admin/.+ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # /feedback is the trickiest of the three: unlike /admin, the API route and the real Next.js
    # page (web/app/feedback/page.tsx) share the EXACT same bare path, not just a common prefix —
    # they're distinguished only by HTTP method (POST vs GET), which this regex-based routing can't
    # see. So the API route itself lives at /feedback/submit (a real sub-path, not bare /feedback),
    # the same fix shape as /admin above; bare /feedback (and /feedback/) always falls through to
    # the app, which renders the actual page regardless of method.
    location ~ ^/feedback/.+ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # Kept for callers that use the /api/ prefix (the older static UI, scripts, curl). The trailing
    # slash on proxy_pass strips the prefix, so both spellings reach the same routes.
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # ── The app ──────────────────────────────────────────────────────────────
    # Next.js renders and routes everything else, including its own /_next assets.
    location / {
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Websocket/HMR upgrade headers so a dev-mode container also works behind this edge.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
