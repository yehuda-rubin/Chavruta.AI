# Chavruta.AI — full local stack in Docker.
#
# ⚠️ PREREQUISITE — the corpus is NOT included and NOT downloaded automatically.
#    A fresh `docker compose up` gives you an EMPTY Qdrant. The API will start, but every question
#    returns nothing. Restore the PRODUCTION collection first, against the running qdrant service
#    (see docs/COMMERCIAL_CORPUS.md):
#
#       docker compose up -d qdrant
#       QDRANT_CONTAINER=chavruta-qdrant python scripts/restore_commercial_snapshot.py
#           # ^ restores chavruta_commercial from the HF snapshot, RAM-safe (docker cp + local-file
#           #   recover instead of an HTTP upload — matters on anything under ~2x the snapshot size,
#           #   e.g. a small cloud VM). Do NOT use scripts/load_all_indexes.py here — it builds a
#           #   DIFFERENT, non-commercial collection (chavruta_mixed) and must never be pointed at
#           #   chavruta_commercial; that script exists only for local experimentation.
#       python scripts/create_payload_indexes.py    # REQUIRED — without it, ref anchoring times out
#
#    `/ready` tells you the truth: it returns 503 with a reason until the collection has points.
#
#   docker compose up --build         # start the whole app (api + web)
#   open http://localhost:5173        # the UI
#   docker compose down               # stop (conversation DB + caches persist)
#
# Architecture (the LLM runs on Nebius; everything else is local containers):
#   web (nginx)  ──/api──▶  api (FastAPI + bge-m3, CPU)  ──▶  Nebius (Qwen, generation)
#                                       │
#                                       └─▶ qdrant (server, named volume `qdrant_storage`)
#
# Generation uses the Nebius API — put NEBIUS_API_KEY in a .env file beside this one (copy from
# .env.example). Without it the API now fails fast at boot with an explicit message rather than
# 500-ing on the first question.
#
# Retrieval runs against the `qdrant` SERVER below (CHAVRUTA_QDRANT_MODE=server), storing into the
# named volume `qdrant_storage`. The old embedded-store layout under ./data/qdrant is gone.

services:
  # ── Backend: FastAPI RAG query service ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.endpoint
    container_name: chavruta-api
    restart: unless-stopped
    environment:
      # Local deployment, but generation is delegated to Nebius.
      CHAVRUTA_PROFILE: local
      CHAVRUTA_EMBEDDING_DEVICE: cpu

      # Retrieval — HYBRID against the Qdrant SERVER (2.4M-point dense+sparse index).
      # Embedded mode cannot do hybrid at this scale (brute force → timeouts).
      CHAVRUTA_QDRANT_MODE: server
      CHAVRUTA_QDRANT_URL: http://qdrant:6333
      # The live production collection. The older mixed-licence `chavruta` was DELETED 2026-07-20;
      # naming it here gives a silently EMPTY RAG (every question returns nothing, no error).
      CHAVRUTA_COLLECTION: ${CHAVRUTA_COLLECTION:-chavruta_commercial}
      CHAVRUTA_MEM_TIER: ${CHAVRUTA_MEM_TIER:-ssd}
      CHAVRUTA_HYBRID: "true"
      CHAVRUTA_RERANK: "false"
      CHAVRUTA_RELEVANCE_THRESHOLD: "0.0"

      # Generation — Nebius Token Factory (OpenAI-compatible). Qwen3-235B-Instruct is the model the
      # prompts are tuned and verified against; it is NON-thinking, so it does not hit the empty-content
      # problem the older Qwen3 "thinking" models had under a tight token budget. Keep this in sync with
      # .env.example and scripts/serve.ps1 — a different model here silently changes answer quality.
      CHAVRUTA_LLM_BACKEND: nebius
      CHAVRUTA_LLM_MODEL: ${CHAVRUTA_LLM_MODEL:-Qwen/Qwen3-235B-A22B-Instruct-2507}
      CHAVRUTA_LLM_BASE_URL: ${CHAVRUTA_LLM_BASE_URL:-https://api.studio.nebius.ai/v1}
      CHAVRUTA_LLM_API_KEY: ${NEBIUS_API_KEY:-}

      # Exactly one trusted proxy sits in front of the API in this topology: the `web` nginx. So the
      # real client is the last X-Forwarded-For hop nginx appends — the per-IP rate limiter reads that
      # instead of the (spoofable) leftmost value. Raise this only if you add more proxies in front.
      CHAVRUTA_TRUSTED_PROXY_HOPS: "1"

      # Supabase Auth — unset (default) keeps the API in open/local mode, unchanged from before this
      # existed. Set both in .env once a real Supabase project exists (see app/auth_supabase.py) to
      # require a signed-in user's JWT on every request instead of treating every caller as 'local'.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Global concurrency cap on generations running at once (see .env.example for the full
      # explanation). Default 2 assumes a 2-vCPU free-tier box.
      #
      # Until 2026-08-19 this was ALSO the CPU-protection knob, so it had to stay under the host's
      # vCPU count. Measured live that day (300 real requests): the CPU-bound part of a request
      # (embedding + Qdrant) is 0.6-8.7s against a 30-100s+ total — the rest is waiting on the LLM
      # API, holding no CPU. CHAVRUTA_MAX_CONCURRENT_RETRIEVALS below now does the CPU protection
      # specifically, so THIS one bounds thread/memory growth from requests mostly sitting idle —
      # it can go well past the vCPU count. Stay under Starlette's default sync-route thread-pool
      # ceiling (40), or requests queue invisibly one layer up instead of at this gate.
      CHAVRUTA_MAX_CONCURRENT_GENERATIONS: ${CHAVRUTA_MAX_CONCURRENT_GENERATIONS:-2}
      # The CPU-bound gate itself (src/chavruta/retrieval/hybrid.py::_retrieval_gate) — see above.
      # Default 4 is conservative for an 8-core box: bge-m3/BLAS get no explicit thread cap here
      # (unlike scripts/nightly_eval.py's subprocess), so a single call may already use several
      # cores on its own.
      CHAVRUTA_MAX_CONCURRENT_RETRIEVALS: ${CHAVRUTA_MAX_CONCURRENT_RETRIEVALS:-4}

      # What a million normalized tokens cost at the provider, so the admin panel can turn spend into
      # money. Deliberately no default: unset means the panel shows nothing rather than a plausible
      # invented figure (app/api.py::admin_usage_over_time). It has to be listed HERE and not only in
      # .env — this service passes an explicit environment block, so .env only fills ${...} holes and
      # a variable with no hole to fill never reaches the container at all. Setting it in .env alone
      # looked done and left the panel reading zero.
      CHAVRUTA_COST_PER_M_TOKENS: ${CHAVRUTA_COST_PER_M_TOKENS:-}
      CHAVRUTA_QUEUE_TIMEOUT_S: ${CHAVRUTA_QUEUE_TIMEOUT_S:-45}

      # Parshat HaShavua / Daf Yomi — beta, hand-picked owner_ids only (see app/api.py::
      # _calendar_modes_enabled). Empty = nobody sees the modes yet.
      CHAVRUTA_CALENDAR_BETA_OWNERS: ${CHAVRUTA_CALENDAR_BETA_OWNERS:-}
      # The sugya study game (app/api.py::_sugya_enabled) and the model's trailing source list
      # (::_source_note_enabled). Same allowlist shape, separate variables — being in one beta must
      # not enrol you in another. Empty = nobody.
      CHAVRUTA_SUGYA_BETA_OWNERS: ${CHAVRUTA_SUGYA_BETA_OWNERS:-}
      CHAVRUTA_SOURCE_NOTE_OWNERS: ${CHAVRUTA_SOURCE_NOTE_OWNERS:-}
      # Small/fast model for the cheap _wants_full_lesson yes/no classification — deliberately NOT
      # the main generation model (see app/api.py::_classifier_llm).
      CHAVRUTA_CLASSIFIER_MODEL: ${CHAVRUTA_CLASSIFIER_MODEL:-}

      # Admin dashboard (see app/api.py::_is_admin) — a dedicated allowlist, no wildcard.
      CHAVRUTA_ADMIN_OWNERS: ${CHAVRUTA_ADMIN_OWNERS:-}
      # Backend error tracking (see app/api.py::_configure_sentry) — no-op unless set.
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Chat history — persisted to the named volume below.
      CHAVRUTA_DB_PATH: /app-data/chavruta.db

      # Where the nightly evaluation writes what it generates (harvested pairs, per-night logs).
      # Separate from /app/eval, which is the read-only curated question sets — see the volumes below.
      CHAVRUTA_EVAL_OUT: /app/eval-out
    volumes:
      - chavruta_db:/app-data             # SQLite conversation history (persists)
      - hf_cache:/root/.cache/huggingface # bge-m3 / model cache
      # Corpus-derived link graph (pasuk↔commentary edges — see src/chavruta/corpus/links.py and
      # pipeline.py's LinkStore/RefIndex loading). Built by scripts/build_link_index.py +
      # scripts/build_corpus_links.py against the live corpus; read-only since the app never writes
      # to it. Absent ⇒ pipeline.py falls back to no link expansion at all (not an error).
      - ./data/linkgraph:/app/data:ro
      # Nightly retrieval evaluation (scripts/nightly_eval.py, woken by a systemd timer on the host).
      # Mounted rather than baked into the image so a change to the eval tooling does not require
      # rebuilding and restarting the serving container. Read-only: the container runs these, it
      # never edits them. None of this is on the request path, so a missing mount degrades the
      # nightly job and nothing else.
      - ./scripts:/app/scripts:ro
      # The hand-written question sets are curated, version-controlled INPUT — read-only, so the job
      # cannot edit the very set it is being judged against. Generated artefacts (harvested pairs,
      # nightly logs) go to their own writable volume instead; the container runs as uid 10001 and
      # cannot write into the repo checkout anyway.
      - ./eval:/app/eval:ro
      - ./lessons:/app/lessons:ro
      - eval_out:/app/eval-out
    depends_on:
      - qdrant
    expose:
      - "8080"                            # internal only — nginx (`web`) proxies /api to it.
    # NOT published to the host. A `ports: 8080:8080` mapping here binds 0.0.0.0 and reaches the API
    # directly, skipping nginx and every limit it carries — on an API that has no auth of its own,
    # that is anonymous, billable access to the LLM. For local debugging use `web` (:5173), or
    # temporarily add the mapping yourself; do not commit it.
    healthcheck:
      # /ready, not /health: readiness asserts the corpus is actually loaded, so `web` will not start
      # in front of an API that answers every question with nothing.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/ready').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 120s                  # bge-m3 load + first warm-up
      retries: 3

  # ── Frontend: the Next.js app (web/), run as a standalone Node server ────────
  # Was previously a build of the deprecated Vite SPA under app/frontend/, so `docker compose up`
  # served a UI nobody was developing. Not published to the host: `web` (nginx) is the only door in.
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # NEXT_PUBLIC_* vars are inlined at `next build` time, not read at container start — the
      # `environment:` block below runs too late to reach the client bundle. These args are what
      # actually gets them into the compiled JS; without them Supabase auth silently no-ops.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    container_name: chavruta-ui
    restart: unless-stopped
    environment:
      # Only used by the dev-mode rewrites; behind this topology nginx routes the API itself.
      CHAVRUTA_API_ORIGIN: http://api:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  # ── Edge: nginx — the only published port. Splits /api routes to `api`, the rest to `ui`.
  # It is also what appends the real client IP, which the API's per-IP rate limiter depends on
  # (CHAVRUTA_TRUSTED_PROXY_HOPS=1) — exposing `ui` directly instead would collapse every caller
  # into a single address.
  #
  # ⚠️ Deploying a nginx.conf change needs `docker compose up -d --force-recreate web`, NOT just
  # `docker compose up -d web` (let alone rebuilding api/ui alone). `git pull` replaces this file via
  # write-new+rename rather than editing in place, and a single-file bind mount on an ALREADY-RUNNING
  # container can keep pointing at the old (now-unlinked) inode — `nginx -s reload` inside that
  # container then faithfully reloads the STALE config. Caught live 2026-08-07: the routing fix for
  # /feedback/submit tested as a 500 (nginx serving its own stale config, no route matched, request
  # never reached FastAPI at all) until `--force-recreate` was used on `web` specifically.
  web:
    image: nginx:1.27-alpine
    container_name: chavruta-web
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ui
    ports:
      - "5173:80"                         # open http://localhost:5173

  # ── Qdrant SERVER — the retrieval index ──────────────────────────────────────
  # This is NOT optional: `api` runs with CHAVRUTA_QDRANT_MODE=server and talks to it.
  # It starts EMPTY — see the corpus prerequisite at the top of this file.
  # (`docker compose up -d qdrant` also works standalone, e.g. to load the corpus before
  # starting the rest.)
  qdrant:
    image: qdrant/qdrant:v1.18.2        # pinned: an index/quantization change across versions
    #                                     can silently alter retrieval behaviour
    container_name: chavruta-qdrant
    restart: unless-stopped
    environment:
      # Serve from SSD, not RAM. memmap_threshold makes Qdrant store any segment larger than this
      # (in KB of vectors) memory-mapped from disk — so on a small machine the corpus is paged from
      # SSD instead of pinned in RAM. Belt-and-suspenders alongside the per-collection "ssd" mem tier
      # (see store/qdrant_store.py); it also covers future segment optimizations of an existing
      # collection. Lower = more aggressively on disk (slower queries, far less RAM).
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB: "20000"
    # Bound to LOCALHOST, not 0.0.0.0. Qdrant here runs with no API key, so publishing it to the
    # network hands anyone read/write on the whole corpus — including the templates collection,
    # whose payloads are turned into repo file reads by the lesson path. `api` reaches it over the
    # compose network and needs no published port at all; these exist for local inspection
    # (http://localhost:6333/dashboard) and can be dropped entirely.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # ── OPTIONAL: one-shot corpus ingestion into the Qdrant SERVER (profile "ingest")
  # Embeds the prebuilt corpus (no Sefaria refetch) and loads it into the server.
  # Long-running on CPU. Start with:  docker compose --profile ingest run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.job
    profiles: ["ingest"]
    environment:
      CHAVRUTA_PROFILE: local
      CHAVRUTA_EMBEDDING_DEVICE: cpu
      CHAVRUTA_QDRANT_MODE: server
      CHAVRUTA_QDRANT_URL: http://qdrant:6333
      CHAVRUTA_COLLECTION: ${CHAVRUTA_COLLECTION:-chavruta_commercial}
      INGEST_CHUNKS_PATH: /data/processed/all_chunks_full.json
    volumes:
      - ./data:/data                      # prebuilt corpus (read) — see data/processed/

volumes:
  chavruta_db:
  hf_cache:
  qdrant_storage:
  eval_out:                             # nightly evaluation output (see api.volumes)
