example_topics:
  - הלכות שבת: מלאכות בישול, בורר, מוקצה ופיקוח נפש מהמשנה לשו"ע ולמשנה ברורה
  - אישות ומשפחה: קידושין, כתובה, כבוד הורים וחינוך ילדים בהלכה
  - צדקה ומשפט: שיעורי צדקה, שמונה מעלות בצדקה לרמב"ם וסדרי קדימה
  - כשרות: בשר בחלב, תערובות וביטול ברוב ובשישים
  - דיני ממונות: השבת אבידה, אונאה, שומרים ודינא דמלכותא דינא
example_queries:
  - מתכונת בתושב"ע 5 יח"ל על יחידת שבת או צדקה (מהמשנה והגמרא לשו"ע ולמשנה ברורה)
  - שאלת בגרות בתושב"ע על שמונה מעלות בצדקה לרמב"ם ופסיקת השולחן ערוך והרמ"א
  - סיכום לבגרות בתושב"ע על השתלשלות ההלכה בהלכות שבת / אישות / כשרות
  - בדוק את תשובתי לשאלת בגרות בתושב"ע על מחלוקת שו"ע ורמ"א
structure: שורש הדין במקרא ובמשנה/גמרא → הגדרות וטעמים ברמב"ם ובראשונים → פסיקת השו"ע והרמ"א (מחלוקות וטעמים) → פרטי הדין במשנה ברורה/אחרונים ושאלת יישום לימודית (עקרון VIII)
structure_en: Biblical & Talmudic Root → Definitions & Rationales in Rambam/Rishonim → Shulchan Arukh & Rema Codification → Mishnah Berurah/Acharonim Details & Exam Study Application (Principle VIII)
