id: bagrut-toshba-thematic-halacha
title: בגרות בתושב"ע (שאלון 5391/5381 — 5 יח"ל) — יחידות נושאיות בהלכה (משורש הסוגיה לפסיקה)
title_en: Toshba Bagrut (5391/5381 — 5 Units) — Thematic Halacha Units (From Roots to Codification)
genre: bagrut-toshba-thematic-halacha
mode: bagrut
audience: school
subject: toshba
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת ליחידות ההלכה הנושאיות בתושב"ע חמ"ד (3–5 יח"ל, שאלונים 5391/5381):
  שבת ומועדים, אישות ומשפחה, כשרות, צדקה ומשפט, דיני ממונות ומצוות התלויות בארץ. עוקבת אחר
  התפתחות הנושא מן המקור במקרא, במשנה ובגמרא, דרך פסיקת הרמב"ם, השולחן ערוך והרמ"א, ועד
  למשנה ברורה ולאחרונים, כולל ניתוח לימודי של שאלות יישום לבחינה (בכפוף לעקרון VIII: לימוד
  עיוני לבחינת הבגרות בלבד, אינו פסק הלכה למעשה).
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול בגרות, מתכונת, בדיקת תשובה או סיכום ביחידות ההלכה הנושאיות
  בתושב"ע (שבת ומועדים, אישות ומשפחה, צדקה וחסד, כשרות, משפט ודיני ממונות), בדגש על מעקב רב-שכבתי
  מהתורה וחז"ל אל הרמב"ם, השו"ע, הרמ"א והמשנה ברורה.
