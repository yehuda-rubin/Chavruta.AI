id: bagrut-machshava-comprehensive
title: בחינת מתכונת מקיפה לבגרות במחשבת ישראל (רב-נושאית, שאלונים 281 / 282 / 5281)
title_en: Comprehensive Bagrut Mock Exam in Jewish Thought (Machshevet Yisrael, Questionnaires 281 / 282 / 5281)
genre: bagrut-machshava-comprehensive
mode: bagrut
audience: school
subject: machshava
bagrut_track: mmd
bagrut_units: 2-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בחינת מתכונת מקיפה במחשבת ישראל (שאלונים 281, 282, 5281).
  כוללת 4 פרקים מובחנים:
  פרק ראשון — אמונה, מדע והתגלות (הכוזרי והרמב"ם);
  פרק שני — תורת האדם, מוסר ובחירה חופשית (שמונה פרקים והלכות תשובה);
  פרק שלישי — גאולה, ציונות דתית וארץ ישראל (הרב קוק והרב סולובייצ'יק);
  פרק רביעי — שאלת עמדה, ניתוח קטע הגותי ויישום אקטואלי.
when_to_use: >
  בחר תבנית זו בכל פעם שתלמיד או מורה מבקש "בחינת מתכונת במחשבת ישראל", "מתכונת במחשבת",
  "שאלון 281", "שאלון 5281" או "מבחן מתכונת בהגות ואמונה".
