id: bagrut-gemara-sugya
title: בגרות בגמרא — ניתוח סוגיה, שקלא וטריא ומונחים בארמית (שאלונים 5391/5291, 3–5 יח"ל)
title_en: Bagrut in Gemara — Sugya Analysis, Shakla Vetarya & Aramaic Terms (Exams 5391/5291, 3–5 Units)
genre: bagrut-gemara-sugya
mode: bagrut
audience: school
subject: gemara
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית מתכונת, מחוון וסיכום לבחינת הבגרות בגמרא (תלמוד בבלי, סגנון שאלונים 5391 / 5291, 3–5 יח"ל).
  ממוקדת בפירוק מבני של הסוגיה התלמודית: משנה (מקרה, דין, טעם ומחלוקת), שלבי השקלא וטריא בגמרא
  (שאלת מקור, קושיא, תירוץ, אוקימתא, איבעיא להו, תא שמע, תיובתא), תרגום ותפקיד מונחים בארמית,
  הסברת הסברות שבבסיס מחלוקות התנאים והאמוראים, וביאור רש"י על הסוגיה.
when_to_use: >
  בחר תבנית זו עבור תלמידים או מורים הלומדים גמרא לבגרות (בבא קמא, בבא מציעא, בבא בתרא, סנהדרין,
  ברכות, שבת, פסחים, ביצה, סוכה, קידושין, גיטין) ומבקשים מבחן מתכונת בגמרא, מחוון מפורט, או
  דף סיכום של השקלא וטריא ומונחי הארמית בסוגיה.
