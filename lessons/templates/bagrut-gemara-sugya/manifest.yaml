example_topics:
  - בבא מציעא — שניים אוחזין בטלית, אלו מציאות, השבת אבידה והשומרים
  - בבא קמא — ארבעה אבות נזיקין, כיצד הרגל, המניח את הכד והחובל
  - סנהדרין — דיני ממונות ודיני נפשות, רודף והבא במחתרת
  - ברכות ושבת — תפילת השחר, מלאכות שבת ומוקצה
example_queries:
  - תכין לי מתכונת בגרות בגמרא 5391 על סוגיית שניים אוחזין
  - סיכום סוגיה לבגרות בגמרא עם טבלת שקלא וטריא ומילון ארמי
  - שאלות בגרות בגמרא עם רש"י ומחוון ניקוד
structure: פרק א׳ (ניתוח המשנה — מקרה, דין ומחלוקת) → פרק ב׳ (שקלא וטריא בגמרא ומונחים בארמית) → פרק ג׳ (רש"י על הסוגיה, סברות והלכה) → מחוון ניקוד
structure_en: Part I (Mishnah Analysis — Case, Ruling & Dispute) → Part II (Gemara Shakla Vetarya & Aramaic Terms) → Part III (Rashi, Rationales & Halachic Conclusion) → Grading Rubric
