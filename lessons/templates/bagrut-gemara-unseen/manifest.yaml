id: bagrut-gemara-unseen
title: בגרות בגמרא (שאלון 5391/6281) — סוגיה שלא נלמדה (אנסין בגמרא ורש"י)
title_en: Gemara Bagrut (5391/6281) — Unseen Talmudic Sugya & Rashi Analysis
genre: bagrut-gemara-unseen
mode: bagrut
audience: school
subject: gemara
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת לפרק ה"אנסין" (קטע גמרא ורש"י שלא נלמד) בשאלוני הגמרא לחמ"ד (3–5 יח"ל,
  שאלונים 5391/6281). מתמקדת בפיתוח לומד עצמאי המסוגל לפענח סוגיה תלמודית חדשה בליווי מילון עזר:
  זיהוי מילות המפתח בארמית וחלוקת הסוגיה לשלביה (איבעיא להו, מיתיבי, תא שמע, אוקימתא, שמע מינה),
  הבנת תפקידו של פירוש רש"י בביאור המילים והמהלך הלוגי, וחיבור מושגי לסוגיות שנלמדו במסכת.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול אנסין בגמרא (קטע גמרא שלא נלמד), מתכונת או דף עבודה לפענוח
  עצמאי של סוגיה חדשה עם רש"י (בסגנון הפרק החדש בשאלוני 5391/6281), או בדיקת תשובה לשאלות אנסין בגמרא.
