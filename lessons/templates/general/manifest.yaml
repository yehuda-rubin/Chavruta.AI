id: general
title: סוגיה והלכה — תבנית כללית
genre: gemara-halacha
audience: yeshiva
grade_band: beit-midrash
age_range: 16+ — בני ישיבה / לומדי בית מדרש
mode: lesson
description: 'שיעור בית-מדרש קלאסי הבנוי כסולם מקורות מסורתי: מן המקרא, דרך המשנה
  והגמרא ורש"י, אל הראשונים ונושאי הכלים, ועד השולחן ערוך ופוסקי זמננו. מתאים לבירור
  סוגיה תלמודית או לבירור הלכתי שיש בו מחלוקת שיטות, ליבון סברות, ופסק להלכה עם נפקא
  מינה למעשה.

  '
when_to_use: 'בחר תבנית זו כאשר נושא השיעור הוא סוגיית גמרא או שאלה הלכתית הנשענת
  על שרשרת מקורות מסודרת (מקרא → משנה → גמרא → ראשונים → שו"ע → פוסקים); כאשר יש מחלוקת
  בין תנאים/ראשונים או חידה הלכתית הדורשת ליבון; וכאשר המטרה היא להגיע להלכה למעשה.

  '
