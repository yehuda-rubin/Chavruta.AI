example_topics:
  - אירועונים לימודיים בהלכות שבת, מוקצה ובישול
  - אירועונים לימודיים בהלכות השבת אבידה, שומרים ונזיקין
  - אירועונים לימודיים בהלכות כשרות, ברכות ותפילה
  - אירועונים לימודיים בהלכות צדקה, כיבוד הורים ובין אדם לחברו
example_queries:
