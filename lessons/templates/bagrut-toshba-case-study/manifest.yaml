  - איך עונים על שאלת אירועון בבגרות בהלכה
  - מתכונת בתושב"ע עם אירועונים לימודיים בשולחן ערוך ומשנה ברורה
structure: הבהרת עקרון VIII → פרק א׳ (אירועוני יסוד — זיהוי הדין, המקור והטעם) → פרק ב׳ (אירועונים מורכבים — מחלוקת הפוסקים ושינוי בפרטי המקרה) → מחוון ניקוד
structure_en: Principle VIII Advisory → Part I (Foundational Case Studies — Identifying Ruling, Source & Rationale) → Part II (Complex Case Studies — Poskim Disputes & Changed Circumstances) → Rubric
