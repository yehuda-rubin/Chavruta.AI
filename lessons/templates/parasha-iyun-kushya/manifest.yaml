id: parasha-iyun-kushya
title: פרשה — עיון סביב קושי
genre: parasha-tanakh
audience: yeshiva
grade_band: beit-midrash
age_range: 16+ — בני ישיבה / לומדי בית מדרש
mode: lesson
description: 'שיעור פרשה הבנוי סביב קושי אחד בפסוק או בסיפור: הצגת הקושי, מפרש ראשון עם ביקורת, מפרש שני
  עם ביקורת, מפרש שלישי עם ביקורת, הצעה מסכמת ופסוק סוגר. כל מפרש נבחן לפי מה שהוא פותר ומה נשאר קשה.'
when_to_use: בחר תבנית זו כאשר הלומד שואל שאלה או מזהה קושי בפסוק או בסיפור במקרא ('למה', 'מה קשה', 'איך
  מיישבים'), ורוצה לראות כמה מפרשים מתמודדים עם אותו קושי, זה מול זה. לא כשהוא מבקש סקירה כללית של הפרשה
  (parasha) ולא דף שאלות (parasha-questions-sheet).
keywords:
- קושי בפסוק
- למה
- מה קשה
- רש"י
- אבן עזרא
- ספורנו
- רמב"ן
- רשב"ם
- אור החיים
- פרשת שבוע
- פירוש
- קושיה
- מחלוקת מפרשים
structure: קושי → מפרש א' וביקורת → מפרש ב' וביקורת → מפרש ג' וביקורת → הצעה → פסוק סוגר
files:
