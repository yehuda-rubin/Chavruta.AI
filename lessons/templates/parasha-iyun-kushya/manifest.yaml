  lesson_flow: TEMPLATE_lesson_flow.md
  full_lesson: TEMPLATE_full_lesson.md
example_topics:
- למה אברהם לא התווכח על העקדה
- מה הקושי בפסוק הראשון בבראשית
- מדוע ה' הקשה את לב פרעה
- הקושי בסיפור עשו ויעקב והבכורה
