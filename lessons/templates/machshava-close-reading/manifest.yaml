id: machshava-close-reading
title: מחשבה — קריאה צמודה
genre: machshava
audience: yeshiva
grade_band: beit-midrash
age_range: 16+ — בני ישיבה / לומדי בית מדרש
mode: lesson
description: 'שיעור מחשבה שבנוי סביב קטע מרכזי אחד מספר מחשבה או מוסר (מהר"ל, מסילת ישרים, ספר החינוך):
  הקטע בציטוט מדויק, מדרש או מקור מקביל, קשרים לרעיונות קרובים, וסיום פתוח או הפניה להמשך לימוד.'
when_to_use: 'בחר תבנית זו כאשר הלומד מבקש להבין קטע אחד מספר מחשבה או מוסר, או רעיון אחד של מהר"ל, רמח"ל
  או ספר החינוך, בקריאה צמודה: מה כתוב, מה המקור, ומה הרעיון. לא כשהשאלה היא הלכה למעשה ולא כשהיא סוגיה
  בגמרא.'
keywords:
- מחשבה
- קריאה צמודה
- מהר"ל
- מסילת ישרים
- רמח"ל
- ספר החינוך
- מוסר
- יראת שמים
- מידות
- רעיון
- הסבר קטע
- מהות
structure: הקטע → מקור או מדרש מקביל → קשרים לרעיונות קרובים → סיום פתוח
files:
