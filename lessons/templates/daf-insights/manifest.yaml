id: daf-insights
title: דף יומי — תובנות על הדף
genre: gemara-daf
audience: yeshiva
grade_band: beit-midrash
age_range: 16+ — בני ישיבה / לומדי בית מדרש
mode: lesson
description: 'יחידת לימוד קצרה על דף בגמרא: כותרת נושא, קושיה על לשון הגמרא או המשנה, תשובות הראשונים
  לפי שמם (רש"י, תוספות, רשב"א, רא"ש, ריטב"א), ניתוח קצר ומסקנה או מתח פתוח. מיועד ללומד הדף היומי, לא
  לשיעור עיון מלא.'
when_to_use: 'בחר תבנית זו כאשר הלומד מבקש תובנה, קושיה או נקודה אחת מתוך דף בגמרא (דף יומי), ורוצה לראות
  מה אמרו הראשונים עליה בקצרה: קושיה → תשובות לפי שם → מסקנה. לא כשהמטרה היא חקירה למדנית עמוקה (אז gemara-iyun)
  ולא פסק הלכה (אז halacha).'
keywords:
