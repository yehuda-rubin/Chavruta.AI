id: bagrut-tanakh-mamlachti-themes
title: בגרות בתנ"ך ממלכתי (שאלון 1281/0581) — נושאי רוחב, ספרות החכמה והיסטוריוגרפיה
title_en: Tanakh Bagrut Mamlachti (1281/0581) — Thematic Units, Wisdom Literature & Historiography
genre: bagrut-tanakh-mamlachti-themes
mode: bagrut
audience: school
subject: tanakh
bagrut_track: mamlachti
bagrut_units: 2-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת לחטיבות הנושאיות ולספרות החכמה בתנ"ך ממלכתי (2–5 יח"ל, שאלונים 1281/0581):
  חוק וחברה במקרא, מוסר ונבואה (נביא אמת מול נביא שקר), ספרות החכמה והשירה (איוב, קהלת, משלי, תהילים —
  שאלת הגמול וצדיק ורע לו), והיסטוריוגרפיה מקראית (שמואל/מלכים מול דברי הימים). משלבת ניתוח רעיוני-ערכי,
  אמצעים ספרותיים, השוואה בין תפיסות עולם מקראיות (כגון גמול אישי מול גמול לדורות), ודיון בדילמה מוסרית.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול בגרות, מתכונת, בדיקת תשובה או סיכום בתנ"ך ממלכתי (שאלון 1281 או 5 יח"ל)
  סביב נושאי רוחב: ספרות החכמה (איוב, קהלת, תהילים, משלי), חוק וצדק חברתי, דמות המנהיג, נבואת אמת מול שקר,
  או השוואה היסטוריוגרפית בין ספר מלכים לספר דברי הימים.
