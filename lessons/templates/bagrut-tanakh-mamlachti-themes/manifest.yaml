  - מתכונת בתנ"ך ממלכתי על חוק וחברה במקרא ודילמה מוסרית
  - סיכום לבגרות בתנ"ך ממלכתי על קהלת וספרות החכמה
  - השוואה לבגרות בין ספר מלכים לדברי הימים (היסטוריוגרפיה מקראית)
