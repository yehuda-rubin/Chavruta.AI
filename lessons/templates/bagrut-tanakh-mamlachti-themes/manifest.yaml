example_topics:
  - תורת הגמול ומשבר האמונה בספר איוב (פרקים א'–ב', ל"ח–מ"ב) ומזמורי תהילים (ע"ג, א')
  - חיפוש משמעות החיים והבל ההבלים בספר קהלת
  - חוק וחברה: יחס המקרא לגר, ליתום, לאלמנה ולעבד (שמות, דברים ונביאים)
  - מאבק נביא אמת בנביאי שקר (ירמיהו כ"ח, מלכים א' כ"ב)
  - היסטוריוגרפיה: דמות דוד, שלמה או יאשיהו במלכים לעומת דברי הימים
example_queries:
