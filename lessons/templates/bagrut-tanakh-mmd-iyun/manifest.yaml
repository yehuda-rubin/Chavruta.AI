  - 5 יח"ל
  - 3 יח"ל
example_topics:
  - בריאת העולם והאדם (בראשית א–ג) בעיון
  - עקדת יצחק וניסיונות אברהם בראי המפרשים
  - מתן תורה וחטא העגל (שמות יט–לב) — רש"י ורמב"ן
  - נבואות ישעיהו וירמיהו — מוסר ומנהיגות
example_queries:
  - תכין לי מתכונת בגרות בתנ"ך חמ"ד 5 יח"ל על פרשת בראשית עם רש"י ורמב"ן
  - סיכום לבגרות בתנ"ך דתי על הקושי בפסוק ושיטות המפרשים
  - שאלת בגרות בעיון בתנ"ך עם מחוון תשובות וניקוד
structure: פרק א׳ (קטע שלא נלמד / אנסין) → פרק ב׳ (תורה בעיון — הקושי בפסוק והשוואת מפרשים) → פרק ג׳ (נביאים וכתובים בעיון) → מחוון ניקוד מפורט
structure_en: Part I (Unseen Passage) → Part II (Torah In-Depth — Textual Difficulty & Commentator Comparison) → Part III (Prophets & Writings In-Depth) → Detailed Grading Rubric
