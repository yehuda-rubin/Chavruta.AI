id: bagrut-tanakh-mmd-iyun
title: בגרות בתנ"ך חמ"ד — פרקי עיון ופרשנות (3–5 יח"ל)
title_en: Bagrut in Tanakh (MMD) — In-Depth Exegesis & Commentary (3–5 Units)
genre: bagrut-tanakh-mmd-iyun
mode: bagrut
audience: school
subject: tanakh
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית הכנה, מתכונת, מחוון וסיכום לבחינת הבגרות בתנ"ך במסלול ממלכתי-דתי (חמ"ד, 3–5 יח"ל,
  שאלוני עיון כגון 2575 / 2585). ממוקדת בניתוח פרקי עיון בתורה ובנביאים לאור פרשנות הראשונים
  והאחרונים (רש"י, רמב"ן, אבן עזרא, רשב"ם, ספורנו, רד"ק, מלבי"ם, מצודות): זיהוי הקושי בפסוק,
  הבחנה בין פשט לדרש, השוואת שיטות מפרשים, וניתוח קטע שלא נלמד (אנסין).
when_to_use: >
  בחר תבנית זו עבור תלמידים או מורים במסלול חמ"ד (3 או 5 יח"ל) המבקשים תרגול שאלות בגרות בעיון,
  בניית בחינת מתכונת בתנ"ך עם מחוון ניקוד מפורט, או הפקת דף סיכום ומיקודית הכוללים השוואת מפרשים
  וזיהוי קשיים בפסוקים.
keywords:
  - בגרות
  - תנ"ך
