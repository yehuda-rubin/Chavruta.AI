id: bagrut-exam-solution
title: בגרות — פתרון מלא ומנומק לשאלון בגרות (תנ"ך, גמרא, תושב"ע)
title_en: Bagrut — Complete Grounded Exam Solution (Tanakh, Gemara, Toshba)
genre: bagrut-exam-solution
mode: bagrut
audience: school
subject: all
bagrut_track: both
bagrut_units: 2-5
grade_band: j-l
age_range: י–י"ב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית ייעודית למתן פתרון מלא, מקיף ומנומק לשאלון בחינת בגרות או מתכונת (שהועלו בקובץ, הודבקו בשאלה, או נבנו מן המקורות)
  בכל מקצועות הבגרות (תנ"ך חמ"ד/כללי, גמרא ותושב"ע).
  כוללת טבלת ריכוז שאלות וניקוד, תשובות מופת מלאות לכל סעיף, פירוק לרכיבי המענה המלא (טענה + ביסוס [S#] + הסבר), וטיפים לבחינה.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש לפתור שאלון בגרות, להפיק פתרון מלא למבחן, לענות על שאלות בגרות סעיף אחר סעיף,
  או כשהועלה קובץ שאלון ומבוקש פתרון מלא להורדה.
