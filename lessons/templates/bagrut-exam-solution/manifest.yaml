example_topics:
  - פתרון שאלון בגרות בתנ"ך (חמ"ד / ממלכתי)
  - פתרון בחינת בגרות בגמרא (מסכת בבא מציעא / פסחים)
  - פתרון שאלון בתושב"ע והלכה (משנה, רמב"ם ושו"ע)
example_queries:
