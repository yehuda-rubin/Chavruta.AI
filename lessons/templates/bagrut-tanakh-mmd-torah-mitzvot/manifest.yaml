example_topics:
  - מצוות צדקה, מעשרות ושמיטה בדברים ט"ו
  - מערכת המשפט והנהגת המלך בדברים ט"ז–י"ז
  - דיני עבד עברי בשמות כ"א מול דברים ט"ו
  - מצוות בין אדם לחברו בפרשת קדושים (ויקרא י"ט)
  - דיני מלחמה, עגלה ערופה והשבת אבידה בדברים כ'–כ"ב
example_queries:
  - שאלת בגרות בתנ"ך חמ"ד על מצוות שמיטה והענקה בדברים ט"ו עם רש"י ורמב"ן
  - מתכונת בתורה ומצוות (שאלון 2575) על חוקי המלך והשופטים בדברים י"ז
  - סיכום לבגרות על השוואת דיני עבד עברי בשמות מול דברים וטעמי המצווה
  - בדוק את תשובתי לשאלת בגרות על פשט מול הלכה בפרשת קדושים
structure: הקשר המצווה ופרטי הדין בפשט → פשט המקרא מול מדרש ההלכה (רש"י) → טעמי המצווה (רמב"ן / חינוך) → השוואה פנים-מקראית בין חומשים → זיקה לקטע שלא נלמד
