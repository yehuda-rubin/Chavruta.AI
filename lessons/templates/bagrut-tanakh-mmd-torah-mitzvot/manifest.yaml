id: bagrut-tanakh-mmd-torah-mitzvot
title: בגרות בתנ"ך חמ"ד (שאלון 2575/2515) — תורה ומצוות בדברים, שמות וויקרא
title_en: Tanakh Bagrut MMD (2575/2515) — Torah, Mitzvot & Legal Commentary
genre: bagrut-tanakh-mmd-torah-mitzvot
mode: bagrut
audience: school
subject: tanakh
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת לחטיבת התורה והמצוות בתנ"ך חמ"ד (3–5 יח"ל, שאלונים 2575/2515 — חומשי דברים,
  שמות וויקרא). מתמקדת בניתוח מצוות וחוקים במקרא: הגדרת המצווה ופרטי הדין מן הכתוב, הבחנה בין פשט המקרא
  לבין מדרש ההלכה בדברי רש"י, טעמי המצוות החברתיים-מוסריים והתיאולוגיים בדברי הרמב"ן, ספר החינוך ואבן עזרא,
  השוואה פנים-מקראית בין ניסוחי מצוות מקבילים בחומשים השונים, וחיבור לקטע שלא נלמד.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול בגרות, מתכונת, בדיקת תשובה או סיכום בפרקי תורה ומצוות במסלול חמ"ד
  (כגון מצוות בספר דברים י"ב–כ"ו, פרשת משפטים בשמות או פרשת קדושים בויקרא), בדגש על פשט מול הלכה,
  טעמי המצוות (רמב"ן / ספר החינוך) והשוואת חוקים מקבילים בתורה.
