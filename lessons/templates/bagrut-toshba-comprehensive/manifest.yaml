id: bagrut-toshba-comprehensive
title: בחינת מתכונת מקיפה לבגרות בתושב"ע — משנה, הלכה ואירועונים (שאלונים 5391 / 5381)
title_en: Comprehensive Bagrut Mock Exam in Toshba — Mishnah, Halacha & Case Studies (Exams 5391 / 5381)
genre: bagrut-toshba-comprehensive
mode: bagrut
audience: school
subject: toshba
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בחינת מתכונת מלאה ומקיפה לבגרות בתושב"ע (משנה, הלכה ואירועונים, שאלונים 5391 ו-5381).
  כוללת 4 פרקים מובחנים המפזרים את השאלות על פני נושאי הלימוד השונים:
  פרק ראשון — פירוק מבני של המשנה (מקרה, דין, טעם, מחלוקת) ופרשנות ר"ע מברטנורא;
  פרק שני — השתלשלות ההלכה בתחום שבת ומועדים (שו"ע ומשנה ברורה);
  פרק שלישי — אירועונים הלכתיים ויישום מעשי בדיני ממונות, כשרות או משפחה;
  פרק רביעי — מבוא לתורה שבעל פה, שרשרת המסירה וכללי פסיקה.
when_to_use: >
  בחר תבנית זו בכל פעם שתלמיד או מורה מבקש "בחינת מתכונת בתושב"ע", "מתכונת מלאה בתושב"ע",
  "שאלון 5391 תושבע", "מבחן בתושב"ע" או "בגרות בתושב"ע" ללא הגבלת נושא בודד.
