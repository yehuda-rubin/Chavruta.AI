id: bagrut-toshba-mishnah-halacha
title: בגרות בתושב"ע — משנה והשתלשלות ההלכה (ברטנורא, רמב"ם, שולחן ערוך ומשנה ברורה, 3–5 יח"ל)
title_en: Bagrut in Toshba (Oral Law) — Mishnah & Halachic Progression (Bartenura, Rambam, Shulchan Arukh, 3–5 Units)
genre: bagrut-toshba-mishnah-halacha
mode: bagrut
audience: school
subject: toshba
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית מתכונת, מחוון וסיכום לבחינת הבגרות בתורה שבעל פה (תושב"ע — משנה והלכה, 3–5 יח"ל).
  ממוקדת בפירוק מבני של המשנה (מקרה, דין, טעם ומחלוקת תנאים), ביאור המשנה לפי ר"ע מברטנורא ופירוש
  המשנה להרמב"ם, ומעקב אחר השתלשלות ההלכה מן המשנה והגמרא אל משנה תורה להרמב"ם, השולחן ערוך
  ונושאי כליו (רמ"א, משנה ברורה).
when_to_use: >
  בחר תבנית זו עבור תלמידים או מורים בתושב"ע (משנה והלכה — שבת ומועדים, אישות ומשפחה, כשרות,
  נזיקין, צדקה ומשפט, מצוות התלויות בארץ) המבקשים מבחן מתכונת, מחוון ניקוד או דף סיכום על
  יחידות המשנה והשתלשלות ההלכה.
