title: בגרות בתנ"ך חמ"ד (שאלון 2575/2585) — נביאים ושיבת ציון (חורבן, גלות וגאולה)
title_en: Tanakh Bagrut MMD (2575/2585) — Prophets, Exile & Return to Zion
