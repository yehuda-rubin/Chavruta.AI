mode: bagrut
audience: school
subject: tanakh
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת לחטיבת הנביאים ושיבת ציון בתנ"ך חמ"ד (3–5 יח"ל, שאלונים 2575/2585 — ירמיהו,
  יחזקאל, ישעיהו, תרי עשר, עזרא, נחמיה וחגי). מתמקדת בקישור שבין הרקע ההיסטורי-גיאופוליטי למשמעות
  הנבואית, פענוח משלים, מעשים סמליים ומראות נבואה (לפי רש"י, רד"ק, מלבי"ם ומצודות), ניתוח הדילמות
  הרוחניות והלאומיות של דור החורבן ודור שיבת ציון, והשוואה בין נבואת החזון למימושה ההיסטורי.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול בגרות, מתכונת, בדיקת תשובה או סיכום בנביאים אחרונים ובספרי שיבת ציון
  במסלול חמ"ד (ירמיהו, יחזקאל, ישעיהו מ'–ס"ו, חגי, זכריה, עזרא ונחמיה), בדגש על רקע היסטורי, משלים ומעשים
  סמליים, פרשנות רד"ק/מלבי"ם/מצודות, ומתח בין חזון הגאולה למציאות שיבת ציון.
