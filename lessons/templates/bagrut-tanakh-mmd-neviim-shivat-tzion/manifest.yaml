  - מתכונת בנביאים ושיבת ציון (שאלון 2575/2585) על עזרא ונחמיה ונבואת חגי
  - סיכום לבגרות על נאום ההיכל בירמיהו ז' והרקע ההיסטורי שלו
  - בדוק את תשובתי לשאלת בגרות על המשל והנמשל בנבואת יחזקאל
