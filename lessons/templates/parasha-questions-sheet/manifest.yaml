id: parasha-questions-sheet
title: פרשה — דף שאלות
genre: parasha-tanakh
audience: yeshiva
grade_band: beit-midrash
age_range: 16+ — בני ישיבה / לומדי בית מדרש
mode: lesson
description: 'דף שאלות לפרק או לפרשה, במקום שיעור רצוף: שאלה כללית על הפרק, השוואת מפרשים על פסוק מרכזי,
  שאלות ודיוקים ברש"י, לשון וסגנון, ושאלת פשט מול דרש. כל שאלה מסומנת ברמת קושי, ולצדה המקורות שהלומד
  פותח כדי לענות.'
when_to_use: בחר תבנית זו כאשר הלומד מבקש דף שאלות, שאלות לעיון, שאלות לחברותא או הכנה לשיעור על פרק או
  פרשה, ולא הסבר רצוף. הפלט הוא רשימת שאלות עם מקורות, לא מאמר.
