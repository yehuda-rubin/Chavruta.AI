id: bagrut-tanakh-mmd-bekiut
title: בגרות בתנ"ך חמ"ד — בקיאות ותוכן (שאלון 2551, 3–5 יח"ל)
title_en: Bagrut in Tanakh (MMD) — Broad Knowledge / Bekiut (Exam 2551, 3–5 Units)
genre: bagrut-tanakh-mmd-bekiut
mode: bagrut
audience: school
subject: tanakh
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית מתכונת, מחוון וסיכום לבחינת הבגרות בבקיאות בתנ"ך במסלול ממלכתי-דתי (חמ"ד, סגנון שאלון 2551).
  מתמקדת בשליטה רחבה בתוכן הפרקים בתורה ובנביאים ראשונים: זיהוי הקשר של פסוק (מי אמר למי ובאיזה הקשר),
  ביאור מילים וביטויים קשים (לפי רש"י ומצודות), מניעי הדמויות, רצף האירועים ומגמת הפרק.
when_to_use: >
  בחר תבנית זו כאשר מכינים מבחן בקיאות בתנ"ך חמ"ד (שאלון 2551 או מבחן בקיאות בית-ספרי), או כאשר
  תלמיד מבקש סיכום בקיאות תמציתי לפרקים רבים בתורה ובנביאים ראשונים (יהושע, שופטים, שמואל, מלכים).
keywords:
