  - מצודות
  - רש"י
  - מתכונת בקיאות
example_topics:
  - בקיאות בספר יהושע ושופטים
  - בקיאות בספר שמואל א–ב (שאול ודוד)
  - בקיאות בספר מלכים א–ב (שלמה, פילוג המלוכה, אליהו ואלישע)
  - בקיאות בפרשות התורה (בראשית–דברים)
example_queries:
  - תכין לי מתכונת בקיאות בתנ"ך 2551 על שמואל א
  - סיכום בקיאות לבגרות בתנ"ך על ספר שופטים
  - שאלות בקיאות מי אמר למי וביאור ביטויים עם מחוון
structure: פרק א׳ (זיהוי הקשר ורצף אירועים בתורה) → פרק ב׳ (ביאור ביטויים ודמויות בנביאים ראשונים) → פרק ג׳ (שאלות רוחב ומגמת הפרק) → מחוון ניקוד
