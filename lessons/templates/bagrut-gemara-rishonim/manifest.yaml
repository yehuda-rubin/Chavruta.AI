example_topics:
  - סוגיות עיון בבבא מציעא עם רש"י ותוספות (שניים אוחזין, יאוש שלא מדעת, השומרים)
  - סוגיות עיון בבבא קמא עם רש"י ותוספות (אבות נזיקין, אדם המזיק)
  - סוגיות עיון בסנהדרין, קידושין, ברכות ושבת עם רש"י ותוספות
example_queries:
  - תכין לי מתכונת בגרות בגמרא עיון 6281 5 יח"ל עם רש"י ותוספות
  - סיכום תוספות ורש"י לבגרות בגמרא עם קושיא תירוץ ונפקא מינה
  - שאלת בגרות על תוספות בגמרא עם מחוון ניקוד
structure: פרק א׳ (הסוגיה בגמרא ושיטת רש"י) → פרק ב׳ (ניתוח דברי התוספות — קושיא, תירוצים ומחלוקת עם רש"י) → פרק ג׳ (שורש המחלוקת, נפקא מינה ופסיקת הלכה) → מחוון
structure_en: Part I (Gemara Sugya & Rashi's Approach) → Part II (Tosafot Analysis — Kushya, Terutzim & Dispute with Rashi) → Part III (Conceptual Root, Nafka Mina & Halacha) → Rubric
