id: bagrut-gemara-rishonim
title: בגרות בגמרא עיון — רש"י ותוספות על הדף, קושיות ותירוצים ונפקא מינה (שאלון 6281, 5 יח"ל)
title_en: Bagrut in Gemara Iyun — Rashi & Tosafot on the Daf, Kushya, Terutz & Nafka Mina (Exam 6281, 5 Units)
genre: bagrut-gemara-rishonim
mode: bagrut
audience: school
subject: gemara
bagrut_track: mmd
bagrut_units: 3-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית מתכונת, מחוון וסיכום לבחינת הבגרות בגמרא ברמת עיון מוגברת (5 יח"ל, סגנון שאלון 6281).
  ממוקדת בלימוד מעמיק של הסוגיה יחד עם שיטות הראשונים על הדף — רש"י ותוספות (וכן רמב"ם ושולחן ערוך):
  זיהוי ההנחה הסמויה של רש"י, קושיית התוספות (ממקור אחר או מסברא), פירוק התירוצים של תוספות,
  בירור שורש המחלוקת בין רש"י לתוספות, והצגת הנפקא מינה להלכה.
when_to_use: >
  בחר תבנית זו עבור תלמידי 5 יח"ל בגמרא עיון (ישיבות תיכוניות ואולפנות, שאלון 6281) או מורים
  המבקשים מבחן מתכונת בעיון עם רש"י ותוספות, מחוון ניקוד למדני, או דף סיכום של שיטות הראשונים בסוגיה.
