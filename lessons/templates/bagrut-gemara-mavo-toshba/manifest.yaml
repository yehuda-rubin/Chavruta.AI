id: bagrut-gemara-mavo-toshba
title: בגרות בגמרא ובתושב"ע (שאלון 5391/6281/5291) — מבוא לתורה שבעל פה והשתלשלות ההלכה
title_en: Gemara & Toshba Bagrut (5391/6281/5291) — Introduction to Oral Law & History of Halacha
genre: bagrut-gemara-mavo-toshba
mode: bagrut
audience: school
subject: gemara
bagrut_track: both
bagrut_units: 2-5
grade_band: j-l
age_range: י–יב — גיל 15–18 (תיכון / בגרות)
description: >
  תבנית בגרות מופשטת לפרקי ה"מבוא לתורה שבעל פה" בשאלוני הגמרא והתושב"ע (שאלונים 5391, 6281, 5291,
  2–5 יח"ל). עוסקת ביחסי תורה שבכתב ותורה שבעל פה, שלשלת המסירה (אבות א' א', הקדמת הרמב"ם למשנה
  ולמשנה תורה, איגרת רב שרירא גאון), עריכת המשנה על ידי רבי יהודה הנשיא והתרחבות המחלוקות,
  ההבדל בין מדרש להלכה למשנה ובין תנאים לאמוראים, עריכת התלמוד הבבלי והירושלמי, וספרות הפוסקים.
when_to_use: >
  בחר תבנית זו כאשר המשתמש מבקש תרגול בגרות, מתכונת, בדיקת תשובה או סיכום בפרקי מבוא לתורה שבעל פה
  (שלשלת הקבלה, עריכת המשנה והתלמוד, סיבות המחלוקת בהלכה, הקדמת הרמב"ם, איגרת רב שרירא גאון,
  תקופות התנאים, האמוראים, הגאונים והראשונים).
keywords:
  - בגרות בגמרא
  - בגרות בתושב"ע
  - מבוא לתורה שבעל פה
