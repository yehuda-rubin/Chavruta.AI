  - שלשלת המסירה
  - עריכת המשנה
  - רבי יהודה הנשיא
  - עריכת התלמוד
  - רב אשי ורבינא
  - הקדמת הרמב"ם למשנה
  - איגרת רב שרירא גאון
  - מחלוקת בהלכה
  - תנאים ואמוראים
  - שאלון 5391
  - שאלון 6281
example_topics:
  - שלשלת הקבלה ממשה בסיני ועד חתימת המשנה (אבות א' א' והקדמת הרמב"ם)
  - חמשת חלקי התורה שבעל פה בהקדמת הרמב"ם לפירוש המשנה
  - מדוע נكتבה המשנה? ("עת לעשות לה' הפרו תורתך" — גיטין ס' ע"ב ואיגרת רש"ג)
  - סיבות התרבות המחלוקות בישראל ("משרבו תלמידי שמאי והלל" — סנהדרין פ"ח ע"ב)
  - ההבדל בין משנה, ברייתא, תוספתא ומדרשי הלכה, ובין תלמוד בבלי לתלמוד ירושלמי
example_queries:
  - שאלות בגרות במבוא לתורה שבעל פה (שאלון 5391) על עריכת המשנה והקדמת הרמב"ם
  - מתכונת במבוא לתושב"ע וגמרא על מחלוקות בהלכה ותקופת התנאים והאמוראים
  - סיכום לבגרות במבוא לתורה שבעל פה: חמשת החלקים בהקדמת הרמב"ם ועריכת התלמוד
  - בדוק את תשובתי לשאלת בגרות על הסיבות לכתיבת המשנה על ידי רבי יהודה הנשיא
structure: יסודות התורה שבעל פה ושלשלת המסירה → חלוקת התושב"ע והמחלוקת (הקדמת הרמב"ם / חז"ל) → עריכת המשנה והתלמוד (רבי יהודה הנשיא / רב אשי ורבינא) → זיהוי שכבות היצירה התלמודית בטקסט
structure_en: Foundations of Oral Law & Chain of Transmission → Classification of Oral Law & Disputes (Rambam's Introduction / Chazal) → Redaction of Mishnah & Talmud → Identifying Rabbinic Strata in a Text
